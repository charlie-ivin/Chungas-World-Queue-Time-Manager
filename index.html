<!doctype html>
<html lang="en" class="map-only-html">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Park Map</title>
<link rel="stylesheet" href="style.css?v=19" />
</head>
<body class="map-only">

<div class="map-wrap map-wrap-tight">
  <div class="map-scroll">
    <div id="mapCanvas" class="map-canvas">
      <div id="placeholderNote" class="map-placeholder-note">
        Placeholder map — add a real image via config.js
      </div>
      <div id="statusPill" class="map-status-badge">Loading…</div>
    </div>
  </div>
</div>

<script src="config.js?v=19"></script>
<script src="park-core.js?v=19"></script>
<script>
let imageFitted = false;

async function render() {
  const canvas = document.getElementById("mapCanvas");
  const pill = document.getElementById("statusPill");

  if (ParkCore.CFG.mapImageUrl && !imageFitted) {
    canvas.classList.add("has-image");
    canvas.style.backgroundImage = `url(${ParkCore.CFG.mapImageUrl})`;
    await ParkCore.fitCanvasToImage(canvas, ParkCore.CFG.mapImageUrl);
    const note = document.getElementById("placeholderNote");
    if (note) note.remove();
    imageFitted = true;
  }

  canvas.querySelectorAll(".pin").forEach((p) => p.remove());

  const data = await ParkCore.loadData();
  const parkStatus = ParkCore.computeParkStatus(data.hours);

  pill.textContent = parkStatus.isSeasonalClosure
    ? (parkStatus.seasonalMessage ? `Closed — Opens ${parkStatus.seasonalMessage}` : "Closed for the Season")
    : parkStatus.isPrivateEvent
    ? "Private Event"
    : data.hours.extended
    ? "Open — Extended Hours"
    : parkStatus.isClosingSoon
    ? `Closing Soon · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.close))}`
    : parkStatus.isOpen
    ? `Open · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.open))} – ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.close))}`
    : parkStatus.isOpeningSoon
    ? `Opening Soon · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.open))}`
    : "Park Closed";

  const isClosed = (!parkStatus.isOpen && !parkStatus.isOpeningSoon) || parkStatus.isSeasonalClosure;
  const isExtended = (!!data.hours.extended || parkStatus.isOpeningSoon) && !parkStatus.isPrivateEvent && !parkStatus.isClosingSoon;
  const isClosingSoon = parkStatus.isClosingSoon;
  const isPrivateEvent = parkStatus.isPrivateEvent;

  pill.classList.toggle("closed", isClosed);
  pill.classList.toggle("extended", isExtended);
  pill.classList.toggle("closing-soon", isClosingSoon);
  pill.classList.toggle("private-event", isPrivateEvent);

  // Belt-and-braces: force the correct color with an inline style too,
  // so nothing external can override it regardless of class state.
  if (isClosed) {
    pill.style.background = "#c1432f";
    pill.style.color = "#fff";
  } else if (isPrivateEvent) {
    pill.style.background = "#8fd0ea";
    pill.style.color = "#1c1c19";
  } else if (isClosingSoon) {
    pill.style.background = "#d98c2b";
    pill.style.color = "#1c1c19";
  } else if (isExtended) {
    pill.style.background = "#f2b632";
    pill.style.color = "#1c1c19";
  } else {
    pill.style.background = "#5b8a2c";
    pill.style.color = "#fff";
  }

  (data.rides || []).forEach((ride) => {
    const pin = document.createElement("div");
    pin.className = "pin";
    pin.style.left = ride.x + "%";
    pin.style.top = ride.y + "%";

    const baseStatus = ride.status;
    const marker = document.createElement("div");
    const label = document.createElement("div");
    label.className = "pin-label";

    let effectiveStatus = baseStatus;
    let queueText;

    if (baseStatus === "closed" && ride.reopensAt) {
      queueText = `Reopening · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(ride.reopensAt))}`;
    } else if (baseStatus !== "open") {
      queueText = ParkCore.STATUS_LABELS[effectiveStatus];
    } else if (ride.customHours && ride.customHours.enabled) {
      const cs = ParkCore.computeRideCustomStatus(ride.customHours);
      const customOpenMins = ParkCore.timeStringToMinutes(ride.customHours.open);
      const parkOpenMins = ParkCore.timeStringToMinutes(data.hours.open);
      const isActuallyDelayed =
        customOpenMins !== null && parkOpenMins !== null && customOpenMins > parkOpenMins;
      const isEarlyOpen =
        customOpenMins !== null && parkOpenMins !== null && customOpenMins < parkOpenMins;

      if (cs.inWindow) {
        // Ride's own hours say it's running right now — this can be
        // true even if the park's own status pill still says closed
        // (e.g. Car Park opening ahead of the main gates).
        queueText = ride.queue === "na" ? "Open" : `${ride.queue} min queue`;
      } else if (!cs.before) {
        effectiveStatus = "ride_closed_today";
        queueText = "Closed for today";
      } else if (isEarlyOpen) {
        effectiveStatus = "ride_opening_soon";
        queueText = `Opening Early · Opens ${ParkCore.formatMinutes(customOpenMins)}`;
      } else if (isActuallyDelayed) {
        effectiveStatus = "ride_opening_soon";
        queueText = `Delayed Opening · Opens ${ParkCore.formatMinutes(customOpenMins)}`;
      } else if (!parkStatus.isOpen) {
        effectiveStatus = "park_closed";
        queueText = parkStatus.isOpeningSoon ? "Opening soon" : "Park closed";
      } else {
        queueText = ride.queue === "na" ? "Open" : `${ride.queue} min queue`;
      }
    } else if (!parkStatus.isOpen) {
      effectiveStatus = "park_closed";
      queueText = parkStatus.isOpeningSoon ? "Opening soon" : "Park closed";
    } else {
      queueText = ride.queue === "na" ? "Open" : `${ride.queue} min queue`;
    }

    marker.className = "pin-marker status-" + effectiveStatus;
    pin.appendChild(marker);

    label.innerHTML = `${ride.name}<br><span class="pin-queue">${queueText}</span>`;
    pin.appendChild(label);

    canvas.appendChild(pin);
  });
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
