<!doctype html>
<html lang="en" class="map-only-html">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Park Map</title>
<link rel="stylesheet" href="style.css?v=19" />
</head>
<body class="map-only">

<div class="map-wrap map-wrap-tight">
  <div id="mapCanvas" class="map-canvas">
    <div id="placeholderNote" class="map-placeholder-note">
      Placeholder map — add a real image via config.js
    </div>
    <div id="statusPill" class="map-status-badge">Loading…</div>
  </div>
</div>

<script src="config.js?v=19"></script>
<script src="park-core.js?v=19"></script>
<script>
async function render() {
  const canvas = document.getElementById("mapCanvas");
  const pill = document.getElementById("statusPill");

  if (ParkCore.CFG.mapImageUrl) {
    canvas.classList.add("has-image");
    canvas.style.backgroundImage = `url(${ParkCore.CFG.mapImageUrl})`;
    await ParkCore.fitCanvasToImage(canvas, ParkCore.CFG.mapImageUrl);
    const note = document.getElementById("placeholderNote");
    if (note) note.remove();
  }

  canvas.querySelectorAll(".pin").forEach((p) => p.remove());

  const data = await ParkCore.loadData();
  const parkStatus = ParkCore.computeParkStatus(data.hours);

  pill.textContent = parkStatus.isSeasonalClosure
    ? (parkStatus.seasonalMessage ? `Closed — Opens ${parkStatus.seasonalMessage}` : "Closed for the Season")
    : parkStatus.isPrivateEvent
    ? "Private Event"
    : data.hours.extended
    ? "Open — Extended Hours"
    : parkStatus.isClosingSoon
    ? `Closing Soon · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.close))}`
    : parkStatus.isOpen
    ? `Open · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.open))} – ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.close))}`
    : parkStatus.isOpeningSoon
    ? `Opening Soon · ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(data.hours.open))}`
    : "Park Closed";
  pill.classList.toggle("closed", (!parkStatus.isOpen && !parkStatus.isOpeningSoon) || parkStatus.isSeasonalClosure);
  pill.classList.toggle("extended", (!!data.hours.extended || parkStatus.isOpeningSoon) && !parkStatus.isPrivateEvent && !parkStatus.isClosingSoon);
  pill.classList.toggle("closing-soon", parkStatus.isClosingSoon);
  pill.classList.toggle("private-event", parkStatus.isPrivateEvent);

  (data.rides || []).forEach((ride) => {
    const pin = document.createElement("div");
    pin.className = "pin";
    pin.style.left = ride.x + "%";
    pin.style.top = ride.y + "%";

    const baseStatus = ride.status;
    const marker = document.createElement("div");
    const label = document.createElement("div");
    label.className = "pin-label";

    let effectiveStatus = baseStatus;
    let queueText;

    if (baseStatus !== "open") {
      queueText = ParkCore.STATUS_LABELS[effectiveStatus];
    } else if (!parkStatus.isOpen) {
      effectiveStatus = "park_closed";
      queueText = parkStatus.isOpeningSoon ? "Opening soon" : "Park closed";
    } else if (ride.customHours && ride.customHours.enabled) {
      const cs = ParkCore.computeRideCustomStatus(ride.customHours);
      if (!cs.inWindow) {
        effectiveStatus = cs.before ? "ride_opening_soon" : "ride_closed_today";
        queueText = cs.before
          ? `Delayed Opening · Opens ${ParkCore.formatMinutes(ParkCore.timeStringToMinutes(ride.customHours.open))}`
          : "Closed for today";
      } else {
        queueText = ride.queue === "na" ? "Open" : `${ride.queue} min queue`;
      }
    } else {
      queueText = ride.queue === "na" ? "Open" : `${ride.queue} min queue`;
    }

    marker.className = "pin-marker status-" + effectiveStatus;
    pin.appendChild(marker);

    label.innerHTML = `${ride.name}<br><span class="pin-queue">${queueText}</span>`;
    pin.appendChild(label);

    canvas.appendChild(pin);
  });
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
