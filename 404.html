<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lost in the Park — 404</title>
<link rel="stylesheet" href="style.css?v=19" />
<style>
  .notfound-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .notfound-panel {
    background: var(--panel);
    color: var(--ink);
    border: 6px solid var(--stone-dark);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.4);
    padding: 32px 28px;
    max-width: 480px;
    text-align: center;
  }

  .notfound-code {
    font-family: "Press Start 2P", monospace;
    font-size: 42px;
    color: var(--red);
    text-shadow: 3px 3px 0 var(--ink);
    margin: 0 0 18px;
    letter-spacing: 2px;
  }

  .notfound-title {
    font-family: "Press Start 2P", monospace;
    font-size: 13px;
    line-height: 1.8;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .notfound-text {
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 24px;
    color: #4a4436;
  }

  .notfound-marker {
    width: 34px;
    height: 34px;
    background: var(--stone);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    margin: 0 auto 18px;
  }

  .notfound-btn {
    display: inline-block;
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    padding: 12px 18px;
    background: var(--grass);
    color: #fff;
    text-decoration: none;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
  }

  .notfound-btn:hover {
    filter: brightness(1.08);
  }

  .notfound-btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }

  @media (max-width: 480px) {
    .notfound-code { font-size: 32px; }
    .notfound-title { font-size: 11px; }
    .notfound-panel { padding: 24px 18px; }
  }
</style>
</head>
<body>
<div class="notfound-wrap">
  <div class="notfound-panel">
    <div class="notfound-marker"></div>
    <p class="notfound-code">404</p>
    <p class="notfound-title">THE PAGE DOES NOT EXIST</p>
    <p class="notfound-text">
      Looks like this queue leads nowhere. The page you're after
      has been removed, renamed, or never existed on this map.
    </p>
    <a class="notfound-btn" href="/">See the Map</a>
  </div>
</div>
</body>
</html>
